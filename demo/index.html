<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offset extension test page</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #14201b; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      .muted { color: #5b6a63; }
      button { min-height: 44px; padding: 0 16px; font: inherit; font-weight: 600; border: 2px solid #14201b; border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover:not(:disabled) { background: #14201b; color: #fff; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      #all { background: #14201b; color: #fff; margin: 16px 0; }
      #status { padding: 10px 12px; border-left: 3px solid #14201b; background: #f3f4f1; }
      table { border-collapse: collapse; margin-top: 8px; width: 100%; }
      td, th { text-align: left; padding: 8px; border-bottom: 1px solid #dfe3de; vertical-align: middle; }
      td.result { font-variant-numeric: tabular-nums; }
      td.action { text-align: right; white-space: nowrap; }
      td button { min-height: 36px; padding: 0 12px; }
    </style>
  </head>
  <body>
    <h1>Offset extension test page</h1>
    <p class="muted">Stands in for the Offset site. Measure everything at once, or one service at a time.</p>
    <p id="status">Looking for the extension...</p>
    <button id="all" disabled>Measure everything</button>
    <p><label><input type="checkbox" id="logins" checked /> Bring me the login page of anything I am signed out of</label></p>
    <p><label><input type="checkbox" id="history" /> Count my whole history (slower)</label></p>
    <p><label><input type="checkbox" id="reuse" checked /> Reuse a result measured in the last 24 hours</label> <button id="forget" style="min-height:32px;padding:0 10px;font-weight:400">Forget saved results</button></p>
    <p><label><input type="checkbox" id="auto" /> Measure again by itself every 30 days</label> <span id="autoNote" class="muted"></span></p>
    <table>
      <tbody id="rows"></tbody>
    </table>

    <script>
      const NAMES = { chatgpt: 'ChatGPT', claude: 'Claude', gemini: 'Gemini', youtube: 'YouTube', doordash: 'DoorDash', ubereats: 'Uber Eats', amazon: 'Amazon', uber: 'Uber', netflix: 'Netflix' };
      const WHY = { closed: 'tab was closed', timeout: 'took too long', unavailable: 'extension did not answer', denied: 'you did not allow it' };
      const status = document.getElementById('status');
      const all = document.getElementById('all');
      const rows = document.getElementById('rows');
      // service -> { kind: 'idle' | 'counting' | 'login' | 'signed-out' | 'done' | 'failed', text }
      const state = Object.fromEntries(Object.keys(NAMES).map((s) => [s, { kind: 'idle', text: '' }]));
      let found = false;
      let noAnswer;

      const send = (message) => window.postMessage({ source: 'offset-site', ...message }, location.origin);
      const working = (s) => s.kind === 'counting' || s.kind === 'login';

      function summary(service, u) {
        const n = (x) => Number(x || 0).toLocaleString('en-US');
        if (service === 'youtube') return `${n(u.videos)} videos and ${n(u.shorts)} Shorts, about ${n(Math.round(u.watchedHours))} hours, in ${u.windowDays} days${u.truncated ? ". Incomplete: stopped early" : ""}`;
        if (service === 'uber') return `${n(u.rides)} rides, ${n(u.miles)} miles in ${u.windowDays} days${u.failedTrips ? `. Incomplete: ${n(u.failedTrips)} trips not read` : ''}`;
        if (service === 'netflix') return `${n(u.titles)} titles in ${u.windowDays} days${u.truncated ? '. Incomplete: stopped early' : ''}`;
        if (service === 'amazon') return `${n(u.orders)} orders, ${n(u.items)} items, $${n(u.spend)} in ${u.windowDays} days${u.truncated ? '. Incomplete: stopped early' : ''}`;
        if (service === 'doordash' || service === 'ubereats') {
          const all = u.history ? `, ${n(u.history.monthly.reduce((t, m) => t + m.orders, 0))} since ${u.history.firstOrder}` : '';
          return `${n(u.orders)} orders (${n(u.deliveries)} delivered) in ${u.windowDays} days${all}${u.truncated ? '. Incomplete: stopped early' : ''}`;
        }
        const images = u.images ? ` and ${n(u.images)} images` : '';
        const short = u.failedConversations ? `. Incomplete: ${n(u.failedConversations)} chats not read yet, so this is too low. Measure again later and it carries on from here` : u.truncated ? ". Incomplete: stopped early" : "";
        const split = u.agentic && (u.agentic.agentTokens || u.agentic.codexTokens) ? ` (agent ${n(u.agentic.agentTokens)}, Codex ${n(u.agentic.codexTokens)})` : '';
        const agent = u.agentic && u.agentic.lifetimeTokens ? `. Agent and Codex: ${n(u.agentic.tokens)} tokens in ${u.windowDays} days, ${n(u.agentic.lifetimeTokens)} all time${split}` : '';
        return `${n(u.prompts)} prompts${images} in ${u.windowDays} days${agent}${short}`;
      }

      // In the background, in a separate minimized window.
      function measure(services, reuse) {
        for (const s of services) state[s] = { kind: 'counting', text: 'Counting...' };
        draw();
        send({ type: 'measure-all', services, openLogins: document.getElementById('logins').checked, history: document.getElementById('history').checked, maxAgeHours: reuse ? 24 : 0, requestId: crypto.randomUUID() });
        clearTimeout(noAnswer);
        // The extension answers "started" at once. Silence means this page has lost
        // touch with it, which happens when the extension was reloaded after the page.
        noAnswer = setTimeout(() => {
          for (const s of services) state[s] = { kind: 'idle', text: '' };
          draw();
          status.textContent = 'The extension did not answer. Reload this page and try again.';
        }, 4000);
      }

      // In a front tab, so the person can log in.
      function logIn(service) {
        state[service] = { kind: 'login', text: 'Waiting for you to log in...' };
        draw();
        send({ type: 'measure', service, requestId: crypto.randomUUID() });
      }

      function draw() {
        rows.innerHTML = '';
        for (const service of Object.keys(NAMES)) {
          const s = state[service];
          const tr = document.createElement('tr');
          tr.innerHTML = `<th>${NAMES[service]}</th><td class="result"></td><td class="action"></td>`;
          tr.children[1].textContent = s.kind === 'signed-out' ? 'Not logged in' : s.text;
          const b = document.createElement('button');
          if (s.kind === 'signed-out') {
            b.textContent = `Log in to ${NAMES[service]}`;
            b.onclick = () => logIn(service);
          } else {
            b.textContent = s.kind === 'done' ? 'Measure again' : 'Measure';
            b.onclick = () => measure([service], false);
          }
          b.disabled = !found || working(s);
          tr.children[2].appendChild(b);
          rows.appendChild(tr);
        }
        const busy = Object.values(state).some(working);
        all.disabled = !found || busy;
        if (found && busy) status.textContent = 'Working in the background. You can stay on this page.';
        else if (found && Object.values(state).some((s) => s.kind !== 'idle')) status.textContent = 'Done.';
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window || event.origin !== location.origin) return;
        const m = event.data;
        if (!m || m.source !== 'offset-extension') return;
        if (m.type === 'ready') {
          if (!found) {
            send({ type: 'results' });
            send({ type: 'auto' });
          }
          found = true;
          status.textContent = `Extension found (version ${m.version}).`;
          draw();
        } else if (m.type === 'started') {
          clearTimeout(noAnswer);
          for (const s of m.needsPermission || []) state[s] = { kind: 'counting', text: 'Waiting for you to allow it...' };
          draw();
        } else if (m.type === 'counting' && state[m.service]) {
          state[m.service] = { kind: 'counting', text: 'Counting...' };
          draw();
        } else if (m.type === 'progress' && state[m.service] && state[m.service].kind === 'counting') {
          const u = m.usage;
          state[m.service] = { kind: 'counting', text: `About ${Number(u.prompts).toLocaleString('en-US')} prompts so far (read ${u.chatsRead} of ${u.chatsTotal} chats)...` };
          draw();
        } else if (m.type === 'login-needed' && state[m.service]) {
          state[m.service] = { kind: 'login', text: 'Its login page is open in a tab. Log in there and it counts by itself.' };
          draw();
        } else if (m.type === 'usage') {
          state[m.service] = { kind: 'done', text: summary(m.service, m.usage) + (m.saved ? ` (measured ${ago(m.measuredAt)})` : '') + (m.history ? ` · history: ${m.history.monthly.length} months from ${m.history.monthly[0] ? m.history.monthly[0].month : 'n/a'}` : '') };
          draw();
        } else if (m.type === 'results') {
          // Saved results, shown as soon as the page opens.
          for (const [service, r] of Object.entries(m.results || {})) {
            if (state[service] && state[service].kind === 'idle') state[service] = { kind: 'done', text: `${summary(service, r.usage)} (measured ${ago(r.measuredAt)}, ${r.record.length} days on record)` };
          }
          draw();
        } else if (m.type === 'auto' && m.auto) {
          document.getElementById('auto').checked = m.auto.enabled;
          const next = m.auto.enabled && m.auto.lastRun ? new Date(Date.parse(m.auto.lastRun) + 30 * 86400000).toLocaleDateString('en-US') : '';
          document.getElementById('autoNote').textContent = m.auto.enabled ? `${m.auto.services.length} services, next on ${next}` : '';
        } else if (m.type === 'forgotten') {
          for (const service of Object.keys(state)) state[service] = { kind: 'idle', text: '' };
          draw();
          status.textContent = 'Saved results deleted.';
        } else if (m.type === 'error' && m.service && state[m.service]) {
          // A late message about a tab closing must not replace a result already shown.
          if (!working(state[m.service])) return;
          state[m.service] =
            m.error === 'signed-out' ? { kind: 'signed-out', text: '' } : { kind: 'failed', text: `Not measured: ${WHY[m.error] || m.error}` };
          draw();
        } else if (m.type === 'error') {
          clearTimeout(noAnswer);
          for (const s of Object.keys(state)) if (working(state[s])) state[s] = { kind: 'idle', text: '' };
          draw();
          status.textContent = `The extension could not start: ${WHY[m.error] || m.error}.`;
        }
      });

      all.addEventListener('click', () => measure(Object.keys(NAMES), document.getElementById('reuse').checked));
      document.getElementById('forget').addEventListener('click', () => send({ type: 'forget' }));
      // Only the services that already have a result are measured again; those are the ones the person allowed.
      document.getElementById('auto').addEventListener('change', (e) =>
        send({ type: 'auto', enabled: e.target.checked, services: Object.keys(state).filter((s) => state[s].kind === 'done') }),
      );

      // How long ago a saved result was measured, in plain words.
      function ago(iso) {
        const minutes = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
        if (minutes < 2) return 'just now';
        if (minutes < 90) return minutes + ' minutes ago';
        if (minutes < 36 * 60) return Math.round(minutes / 60) + ' hours ago';
        return Math.round(minutes / 1440) + ' days ago';
      }

      draw();
      send({ type: 'ping' });
      setTimeout(() => {
        if (!found) status.textContent = 'Extension not found. Load it in chrome://extensions, then reload this page.';
      }, 1500);
    </script>
  </body>
</html>
